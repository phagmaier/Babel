[package]
name = "babel-desktop"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license = "UNLICENSED"

[lib]
name = "babel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-editor-proof = []

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
screenwriter-core = { path = "../crates/screenwriter-core" }
tauri = { version = "=2.12.0", features = [] }

[dev-dependencies]
serde_json = "=1.0.151"
tauri = { version = "=2.12.0", features = ["test"] }
