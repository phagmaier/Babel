[package]
name = "babel-desktop"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license = "UNLICENSED"

[lib]
name = "babel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-editor-proof = []
editor-composition-proof = []

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
screenwriter-core = { path = "../crates/screenwriter-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.12.0", features = [] }
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }

[dev-dependencies]
tauri = { version = "=2.12.0", features = ["test"] }
