[package]
name = "babel-desktop"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license = "UNLICENSED"

[lib]
name = "babel_desktop_lib"
crate-type = ["rlib"]

[features]
editor-composition-proof = []

[build-dependencies]
pkg-config = "=0.3.34"
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
screenwriter-core = { path = "../crates/screenwriter-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.12.0", features = [] }
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_34"] }

[dev-dependencies]
tauri = { version = "=2.12.0", features = ["test"] }
