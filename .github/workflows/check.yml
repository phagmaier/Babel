name: Checks
on:
  push:
  pull_request:
jobs:
  frontend-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version }
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0, run_install: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.97.1', components: 'rustfmt,clippy' }
      - run: cargo fmt --all -- --check
      - run: cargo test -p screenwriter-core --locked
  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version }
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0, run_install: false }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.97.1', components: 'rustfmt,clippy' }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libhunspell-dev hunspell-en-us groff poppler-utils
      - name: Build verified Enchant ABI and probe offline dictionaries
        run: |
          bash tools/ci-enchant.sh "$RUNNER_TEMP/babel-enchant"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/babel-enchant/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/babel-enchant/install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: pnpm pdf-helper
      - run: pnpm test:pdf-helper
      - run: pnpm test:differential
      - run: python3 -m unittest discover -s tests/tools -p 'test_*.py'
      - name: Install pinned Playwright Chromium on the disposable runner
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          node --input-type=module -e "import { chromium } from 'playwright-core'; console.log('CHROMIUM_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - run: pnpm test:browser
      - run: cargo test --workspace --locked
      - run: pnpm tauri build
      - name: The package's own Enchant must find its bundled Hunspell provider
        run: python3 tools/check-package-spellcheck.py target/release/bundle/appimage/babel.AppDir
      - name: Every bundled library must have a retained licence text
        run: python3 tools/check-package-notices.py target/release/bundle/appimage/babel.AppDir
