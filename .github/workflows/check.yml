name: Checks
on:
  push:
  pull_request:
jobs:
  frontend-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version }
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0, run_install: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.97.1', components: 'rustfmt,clippy' }
      - run: cargo fmt --all -- --check
      - run: cargo test -p screenwriter-core --locked
  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version }
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0, run_install: false }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.97.1', components: 'rustfmt,clippy' }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm tauri build
